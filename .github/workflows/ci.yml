# Formatting, lints and tests on every push to main and every pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --offline --all-targets -- -D warnings
      - run: cargo test --offline
